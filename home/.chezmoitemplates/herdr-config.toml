{{- $mode := includeTemplate "theme-mode" . -}}
{{- $omarchyConfig := "/usr/share/omarchy/config/herdr/config.toml" -}}
{{- $base := dict -}}
{{- if stat $omarchyConfig -}}
{{-   $base = output "cat" $omarchyConfig | fromToml -}}
{{- end -}}
{{- $overrides := includeTemplate "herdr-overrides.toml" . | fromToml -}}
{{- $config := mergeOverwrite $base $overrides -}}
{{- if eq $mode "static" -}}
{{-   if not (hasKey $config "theme") -}}
{{-     $_ := set $config "theme" (dict) -}}
{{-   end -}}
{{-   $_ := set (get $config "theme") "name" "rose-pine" -}}
{{- end -}}
# Generated by chezmoi from Omarchy's Herdr defaults plus local overrides.
# Edit ~/.dotfiles/home/.chezmoitemplates/herdr-overrides.toml, not this file.
{{ $config | toToml -}}
